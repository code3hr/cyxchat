name: cyxchat
description: Privacy-first messaging on the CyxWiz mesh network
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.0
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # Database
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.0

  # FFI for C library
  ffi: ^2.1.0

  # Utilities
  equatable: ^2.0.5
  uuid: ^4.2.0
  intl: ^0.18.0

  # QR code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.0

  # Secure storage
  flutter_secure_storage: ^9.0.0
  # Settings persistence
  shared_preferences: ^2.2.0

  # File picker (for attachments)
  file_picker: ^6.1.1

  # Audio recording & playback (voice messages)
  record: ^5.0.4
  just_audio: ^0.9.36

  # Video calls (WebRTC)
  flutter_webrtc: ^0.9.47

  # Permissions (microphone, camera)
  permission_handler: ^11.0.1

  # UI components
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  flutter_launcher_icons: ^0.13.1

# App icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    icon_size: 48
  image_path: "assets/logo.png"
  adaptive_icon_background: "#0D0D1A"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/fonts/
