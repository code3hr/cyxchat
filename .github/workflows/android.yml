name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'app/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

env:
  ANDROID_NDK_VERSION: '26.1.10909125'
  ANDROID_API_LEVEL: '21'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CyxChat
        uses: actions/checkout@v4

      - name: Checkout CyxWiz
        uses: actions/checkout@v4
        with:
          repository: code3hr/conspiracy
          path: cyxwiz

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      # Build libsodium for Android
      - name: Download libsodium
        run: |
          curl -L -o libsodium.tar.gz https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz
          tar -xzf libsodium.tar.gz
          mv libsodium-1.0.20 libsodium

      - name: Build libsodium for Android (arm64-v8a)
        run: |
          cd libsodium
          export ANDROID_NDK_HOME=$ANDROID_NDK_HOME
          export NDK_PLATFORM=android-${{ env.ANDROID_API_LEVEL }}
          export LIBSODIUM_FULL_BUILD=1
          ./dist-build/android-armv8-a.sh

      - name: Build libsodium for Android (armeabi-v7a)
        run: |
          cd libsodium
          export ANDROID_NDK_HOME=$ANDROID_NDK_HOME
          export NDK_PLATFORM=android-${{ env.ANDROID_API_LEVEL }}
          export LIBSODIUM_FULL_BUILD=1
          ./dist-build/android-armv7-a.sh

      - name: Build libsodium for Android (x86_64)
        run: |
          cd libsodium
          export ANDROID_NDK_HOME=$ANDROID_NDK_HOME
          export NDK_PLATFORM=android-${{ env.ANDROID_API_LEVEL }}
          export LIBSODIUM_FULL_BUILD=1
          ./dist-build/android-x86_64.sh

      - name: Verify libsodium headers
        run: |
          echo "=== Checking libsodium-android-armv8-a+crypto structure ==="
          ls -la libsodium/libsodium-android-armv8-a+crypto/
          ls -la libsodium/libsodium-android-armv8-a+crypto/include/
          echo "=== Checking for xchacha20poly1305 header ==="
          ls -la libsodium/libsodium-android-armv8-a+crypto/include/sodium/ | grep xchacha || echo "xchacha not found in sodium dir"
          echo "=== Checking if crypto_secretbox_xchacha20poly1305_NONCEBYTES is defined ==="
          grep -r "crypto_secretbox_xchacha20poly1305_NONCEBYTES" libsodium/libsodium-android-armv8-a+crypto/include/ || echo "Constant not found!"
          echo "=== Checking sodium.h includes ==="
          grep "crypto_secretbox" libsodium/libsodium-android-armv8-a+crypto/include/sodium.h | head -5
          echo "=== Testing preprocess with Android clang ==="
          # Create test file without leading whitespace
          echo '#include <sodium.h>' > /tmp/test_sodium.c
          echo 'int main() { return crypto_secretbox_xchacha20poly1305_NONCEBYTES; }' >> /tmp/test_sodium.c
          echo "=== Test file contents ==="
          cat /tmp/test_sodium.c
          echo "=== Running preprocessor (errors only) ==="
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang \
            --target=aarch64-none-linux-android21 \
            -I${{ github.workspace }}/libsodium/libsodium-android-armv8-a+crypto/include \
            -E /tmp/test_sodium.c > /tmp/preprocess_out.txt 2> /tmp/preprocess_err.txt || true
          echo "=== Preprocessor errors ==="
          cat /tmp/preprocess_err.txt || true
          echo "=== Last 5 lines of preprocess output ==="
          tail -5 /tmp/preprocess_out.txt || true
          echo "=== Searching for NONCEBYTES expansion ==="
          grep -o "24U\|crypto_secretbox_xchacha20poly1305_NONCEBYTES" /tmp/preprocess_out.txt | tail -5 || echo "Neither found!"
          echo "=== Direct header test ==="
          echo '#include "sodium/crypto_secretbox_xchacha20poly1305.h"' > /tmp/test2.c
          echo 'int x = crypto_secretbox_xchacha20poly1305_NONCEBYTES;' >> /tmp/test2.c
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang \
            --target=aarch64-none-linux-android21 \
            -I${{ github.workspace }}/libsodium/libsodium-android-armv8-a+crypto/include \
            -E /tmp/test2.c 2>&1 | tail -10 || echo "Direct include failed"
          echo "=== Include chain with -H (show all includes) ==="
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang \
            --target=aarch64-none-linux-android21 \
            -I${{ github.workspace }}/libsodium/libsodium-android-armv8-a+crypto/include \
            -H -E /tmp/test_sodium.c 2>&1 | grep -i "xchacha\|crypto_secretbox" | head -10 || echo "No xchacha includes found"
          echo "=== Showing sodium.h content (lines 10-30) ==="
          sed -n '10,30p' ${{ github.workspace }}/libsodium/libsodium-android-armv8-a+crypto/include/sodium.h
          echo "=== Showing sodium.h content (lines 45-65) ==="
          sed -n '45,65p' ${{ github.workspace }}/libsodium/libsodium-android-armv8-a+crypto/include/sodium.h

      # Build libcyxwiz for Android
      # We need to explicitly set SODIUM_INCLUDE_DIR and SODIUM_LIBRARY to prevent
      # cmake from finding the system libsodium via pkg-config (which is x86_64, not Android)
      - name: Build libcyxwiz for Android (arm64-v8a)
        run: |
          cd cyxwiz
          export SODIUM_ROOT=${{ github.workspace }}/libsodium/libsodium-android-armv8-a+crypto
          cmake -B build-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API_LEVEL }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCYXWIZ_BUILD_TESTS=OFF \
            -DCYXWIZ_HAS_CRYPTO=ON \
            -DCYXWIZ_TRANSPORT_BLUETOOTH=OFF \
            -DCYXWIZ_TRANSPORT_WIFI=OFF \
            -DCYXWIZ_TRANSPORT_LORA=OFF \
            -DSODIUM_INCLUDE_DIR=$SODIUM_ROOT/include \
            -DSODIUM_LIBRARY=$SODIUM_ROOT/lib/libsodium.a \
            -G Ninja
          cmake --build build-android-arm64 --config Release

      - name: Build libcyxwiz for Android (armeabi-v7a)
        run: |
          cd cyxwiz
          export SODIUM_ROOT=${{ github.workspace }}/libsodium/libsodium-android-armv7-a
          cmake -B build-android-arm32 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API_LEVEL }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCYXWIZ_BUILD_TESTS=OFF \
            -DCYXWIZ_HAS_CRYPTO=ON \
            -DCYXWIZ_TRANSPORT_BLUETOOTH=OFF \
            -DCYXWIZ_TRANSPORT_WIFI=OFF \
            -DCYXWIZ_TRANSPORT_LORA=OFF \
            -DSODIUM_INCLUDE_DIR=$SODIUM_ROOT/include \
            -DSODIUM_LIBRARY=$SODIUM_ROOT/lib/libsodium.a \
            -G Ninja
          cmake --build build-android-arm32 --config Release

      - name: Build libcyxwiz for Android (x86_64)
        run: |
          cd cyxwiz
          export SODIUM_ROOT=${{ github.workspace }}/libsodium/libsodium-android-westmere
          cmake -B build-android-x64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=x86_64 \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API_LEVEL }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCYXWIZ_BUILD_TESTS=OFF \
            -DCYXWIZ_HAS_CRYPTO=ON \
            -DCYXWIZ_TRANSPORT_BLUETOOTH=OFF \
            -DCYXWIZ_TRANSPORT_WIFI=OFF \
            -DCYXWIZ_TRANSPORT_LORA=OFF \
            -DSODIUM_INCLUDE_DIR=$SODIUM_ROOT/include \
            -DSODIUM_LIBRARY=$SODIUM_ROOT/lib/libsodium.a \
            -G Ninja
          cmake --build build-android-x64 --config Release

      # Build libcyxchat for Android
      - name: Build libcyxchat for Android (arm64-v8a)
        run: |
          cd lib
          export SODIUM_ROOT=${{ github.workspace }}/libsodium/libsodium-android-armv8-a+crypto
          cmake -B build-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API_LEVEL }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCYXWIZ_ROOT=${{ github.workspace }}/cyxwiz \
            -DCYXWIZ_BUILD_DIR=${{ github.workspace }}/cyxwiz/build-android-arm64 \
            -DSODIUM_INCLUDE_DIR=$SODIUM_ROOT/include \
            -DSODIUM_LIBRARY=$SODIUM_ROOT/lib/libsodium.a \
            -DCYXCHAT_BUILD_TESTS=OFF \
            -DCYXCHAT_BUILD_STATIC=OFF \
            -G Ninja
          cmake --build build-android-arm64 --config Release

      - name: Build libcyxchat for Android (armeabi-v7a)
        run: |
          cd lib
          export SODIUM_ROOT=${{ github.workspace }}/libsodium/libsodium-android-armv7-a
          cmake -B build-android-arm32 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API_LEVEL }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCYXWIZ_ROOT=${{ github.workspace }}/cyxwiz \
            -DCYXWIZ_BUILD_DIR=${{ github.workspace }}/cyxwiz/build-android-arm32 \
            -DSODIUM_INCLUDE_DIR=$SODIUM_ROOT/include \
            -DSODIUM_LIBRARY=$SODIUM_ROOT/lib/libsodium.a \
            -DCYXCHAT_BUILD_TESTS=OFF \
            -DCYXCHAT_BUILD_STATIC=OFF \
            -G Ninja
          cmake --build build-android-arm32 --config Release

      - name: Build libcyxchat for Android (x86_64)
        run: |
          cd lib
          export SODIUM_ROOT=${{ github.workspace }}/libsodium/libsodium-android-westmere
          cmake -B build-android-x64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=x86_64 \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API_LEVEL }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCYXWIZ_ROOT=${{ github.workspace }}/cyxwiz \
            -DCYXWIZ_BUILD_DIR=${{ github.workspace }}/cyxwiz/build-android-x64 \
            -DSODIUM_INCLUDE_DIR=$SODIUM_ROOT/include \
            -DSODIUM_LIBRARY=$SODIUM_ROOT/lib/libsodium.a \
            -DCYXCHAT_BUILD_TESTS=OFF \
            -DCYXCHAT_BUILD_STATIC=OFF \
            -G Ninja
          cmake --build build-android-x64 --config Release

      # Copy native libraries to jniLibs
      - name: Setup jniLibs
        run: |
          mkdir -p app/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p app/android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p app/android/app/src/main/jniLibs/x86_64

          # Copy libcyxchat
          cp lib/build-android-arm64/libcyxchat.so app/android/app/src/main/jniLibs/arm64-v8a/
          cp lib/build-android-arm32/libcyxchat.so app/android/app/src/main/jniLibs/armeabi-v7a/
          cp lib/build-android-x64/libcyxchat.so app/android/app/src/main/jniLibs/x86_64/

          # List what we have
          ls -la app/android/app/src/main/jniLibs/*/

      # Build Flutter APK
      - name: Get Flutter dependencies
        run: |
          cd app
          flutter pub get

      - name: Build APK
        run: |
          cd app
          flutter build apk --release

      - name: Build App Bundle (AAB)
        run: |
          cd app
          flutter build appbundle --release

      # Upload artifacts
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyxChat-Android-APK
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: CyxChat-Android-AAB
          path: app/build/app/outputs/bundle/release/app-release.aab

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: CyxChat-Android-Libs
          path: app/android/app/src/main/jniLibs/

  # Optional: Create release when tagged
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: CyxChat-Android-APK
          path: ./

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: CyxChat-Android-AAB
          path: ./

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app-release.apk
            app-release.aab
          draft: true
          generate_release_notes: true
