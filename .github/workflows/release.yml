name: Release Builds

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.38.5'
  ANDROID_NDK_VERSION: '27.0.12077973'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_API_LEVEL: '23'
  LIBSODIUM_VERSION: '1.0.20'

jobs:
  validate-flutter:
    name: Validate Flutter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CyxChat
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        working-directory: app
        run: dart analyze .

      - name: Test
        working-directory: app
        run: flutter test

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: validate-flutter
    steps:
      - name: Checkout CyxChat
        uses: actions/checkout@v4
        with:
          path: cyxchat

      - name: Checkout CyxWiz
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/conspiracy
          path: cyxwiz
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install native dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path C:\vcpkg\vcpkg.exe)) {
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat
          }
          C:\vcpkg\vcpkg install libsodium:x64-windows

      - name: Build CyxWiz
        shell: pwsh
        working-directory: cyxwiz
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DCYXWIZ_ENABLE_UPNP=OFF `
            -DCYXWIZ_BUILD_TOOLS=OFF
          cmake --build build --config Release --target cyxwiz

      - name: Locate libsodium
        id: sodium
        shell: pwsh
        run: |
          $candidates = @(
            'C:/vcpkg/installed/x64-windows',
            'C:/vcpkg/packages/libsodium_x64-windows'
          )
          foreach ($root in $candidates) {
            if (Test-Path "$root/include/sodium.h") {
              "include=$root/include" >> $env:GITHUB_OUTPUT
              "library=$root/lib/libsodium.lib" >> $env:GITHUB_OUTPUT
              "bin=$root/bin" >> $env:GITHUB_OUTPUT
              exit 0
            }
          }
          Write-Error 'libsodium was not found after vcpkg install'
          exit 1

      - name: Build CyxChat native library
        shell: pwsh
        working-directory: cyxchat/lib
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCYXWIZ_LIBRARY=${{ github.workspace }}/cyxwiz/build/Release/cyxwiz.lib" `
            "-DCYXWIZ_INCLUDE_DIR=${{ github.workspace }}/cyxwiz/include" `
            "-DSODIUM_INCLUDE_DIR=${{ steps.sodium.outputs.include }}" `
            "-DSODIUM_LIBRARY=${{ steps.sodium.outputs.library }}" `
            -DCYXCHAT_ENABLE_UPNP=OFF `
            -DCYXCHAT_BUILD_TESTS=OFF
          cmake --build build --config Release

      - name: Build Flutter Windows app
        shell: pwsh
        working-directory: cyxchat/app
        run: |
          flutter pub get --enforce-lockfile
          flutter build windows --release

      - name: Copy runtime dependencies
        shell: pwsh
        run: |
          $dest = 'cyxchat/app/build/windows/x64/runner/Release'
          if (Test-Path '${{ steps.sodium.outputs.bin }}/libsodium.dll') {
            Copy-Item '${{ steps.sodium.outputs.bin }}/libsodium.dll' $dest -Force
          }
          if (Test-Path 'C:/vcpkg/installed/x64-windows/bin/miniupnpc.dll') {
            Copy-Item 'C:/vcpkg/installed/x64-windows/bin/miniupnpc.dll' $dest -Force
          }

      - name: Package Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive `
            -Path cyxchat/app/build/windows/x64/runner/Release/* `
            -DestinationPath release-assets/CyxChat-Windows-x64.zip `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyxChat-Windows-x64
          path: release-assets/CyxChat-Windows-x64.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: validate-flutter
    steps:
      - name: Checkout CyxChat
        uses: actions/checkout@v4
        with:
          path: cyxchat

      - name: Checkout CyxWiz
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/conspiracy
          path: cyxwiz
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install native dependencies
        run: brew install libsodium cmake ninja

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build CyxWiz
        working-directory: cyxwiz
        run: |
          SODIUM_PREFIX="$(brew --prefix libsodium)"
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCYXWIZ_ENABLE_UPNP=OFF \
            -DCYXWIZ_BUILD_TOOLS=OFF \
            -DCYXWIZ_TRANSPORT_BLUETOOTH=OFF \
            -DCYXWIZ_TRANSPORT_LORA=OFF \
            "-DSODIUM_INCLUDE_DIR=${SODIUM_PREFIX}/include" \
            "-DSODIUM_LIBRARY=${SODIUM_PREFIX}/lib/libsodium.a"
          cmake --build build --config Release --target cyxwiz

      - name: Build CyxChat native library
        working-directory: cyxchat/lib
        run: |
          SODIUM_PREFIX="$(brew --prefix libsodium)"
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            "-DCYXWIZ_LIBRARY=${{ github.workspace }}/cyxwiz/build/libcyxwiz.a" \
            "-DCYXWIZ_INCLUDE_DIR=${{ github.workspace }}/cyxwiz/include" \
            "-DSODIUM_INCLUDE_DIR=${SODIUM_PREFIX}/include" \
            "-DSODIUM_LIBRARY=${SODIUM_PREFIX}/lib/libsodium.a" \
            -DCYXCHAT_ENABLE_UPNP=OFF \
            -DCYXCHAT_BUILD_TESTS=OFF
          cmake --build build --config Release

      - name: Build Flutter macOS app
        working-directory: cyxchat/app
        run: |
          flutter create --platforms=macos --no-pub .
          sed -i '' 's/platform :osx, .*/platform :osx, "10.15"/' macos/Podfile
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 10.14/MACOSX_DEPLOYMENT_TARGET = 10.15/g' macos/Runner.xcodeproj/project.pbxproj
          flutter pub get --enforce-lockfile
          flutter build macos --release

      - name: Bundle native library
        run: |
          APP_BUNDLE="$(find cyxchat/app/build/macos/Build/Products/Release -name '*.app' -type d | head -1)"
          if [ -z "$APP_BUNDLE" ]; then
            echo 'macOS app bundle not found'
            exit 1
          fi
          mkdir -p "$APP_BUNDLE/Contents/Frameworks"
          cp cyxchat/lib/build/libcyxchat.dylib "$APP_BUNDLE/Contents/Frameworks/libcyxchat.dylib"
          if [ "$APP_BUNDLE" != "cyxchat/app/build/macos/Build/Products/Release/CyxChat.app" ]; then
            rm -rf cyxchat/app/build/macos/Build/Products/Release/CyxChat.app
            mv "$APP_BUNDLE" cyxchat/app/build/macos/Build/Products/Release/CyxChat.app
          fi

      - name: Package macOS artifact
        run: |
          mkdir -p release-assets
          cd cyxchat/app/build/macos/Build/Products/Release
          hdiutil create -volname 'CyxChat' -srcfolder 'CyxChat.app' -ov -format UDZO "$GITHUB_WORKSPACE/release-assets/CyxChat-macOS.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyxChat-macOS
          path: release-assets/CyxChat-macOS.dmg

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: validate-flutter
    steps:
      - name: Checkout CyxChat
        uses: actions/checkout@v4
        with:
          path: cyxchat

      - name: Checkout CyxWiz
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/conspiracy
          path: cyxwiz
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --install "platforms;android-${{ env.ANDROID_COMPILE_SDK }}" "build-tools;36.0.0"
          yes | sdkmanager --install "ndk;${{ env.ANDROID_NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential cmake libtool ninja-build

      - name: Build libsodium for Android
        run: |
          curl -L -o libsodium.tar.gz "https://download.libsodium.org/libsodium/releases/libsodium-${{ env.LIBSODIUM_VERSION }}.tar.gz"
          tar -xzf libsodium.tar.gz
          mv "libsodium-${{ env.LIBSODIUM_VERSION }}" libsodium
          cd libsodium
          export ANDROID_NDK_HOME="$ANDROID_NDK_HOME"
          export NDK_PLATFORM="android-${{ env.ANDROID_API_LEVEL }}"
          export LIBSODIUM_FULL_BUILD=1
          ./dist-build/android-armv8-a.sh
          ./dist-build/android-armv7-a.sh
          ./dist-build/android-x86_64.sh

      - name: Build CyxWiz for Android
        run: |
          for row in \
            "arm64-v8a build-android-arm64 $GITHUB_WORKSPACE/libsodium/libsodium-android-armv8-a+crypto" \
            "armeabi-v7a build-android-arm32 $GITHUB_WORKSPACE/libsodium/libsodium-android-armv7-a" \
            "x86_64 build-android-x64 $GITHUB_WORKSPACE/libsodium/libsodium-android-westmere"
          do
            set -- $row
            ABI="$1"
            BUILD_DIR="$2"
            SODIUM_ROOT="$3"
            cmake -S cyxwiz -B "cyxwiz/$BUILD_DIR" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM="android-${{ env.ANDROID_API_LEVEL }}" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCYXWIZ_ENABLE_UPNP=OFF \
              -DCYXWIZ_BUILD_TESTS=OFF \
              -DCYXWIZ_BUILD_TOOLS=OFF \
              -DCYXWIZ_HAS_CRYPTO=ON \
              -DCYXWIZ_TRANSPORT_BLUETOOTH=OFF \
              -DCYXWIZ_TRANSPORT_WIFI=OFF \
              -DCYXWIZ_TRANSPORT_LORA=OFF \
              -DSODIUM_INCLUDE_DIR="$SODIUM_ROOT/include" \
              -DSODIUM_LIBRARY="$SODIUM_ROOT/lib/libsodium.a" \
              -G Ninja
            cmake --build "cyxwiz/$BUILD_DIR" --config Release --target cyxwiz
          done

      - name: Build CyxChat for Android
        run: |
          for row in \
            "arm64-v8a build-android-arm64 $GITHUB_WORKSPACE/libsodium/libsodium-android-armv8-a+crypto" \
            "armeabi-v7a build-android-arm32 $GITHUB_WORKSPACE/libsodium/libsodium-android-armv7-a" \
            "x86_64 build-android-x64 $GITHUB_WORKSPACE/libsodium/libsodium-android-westmere"
          do
            set -- $row
            ABI="$1"
            BUILD_DIR="$2"
            SODIUM_ROOT="$3"
            cmake -S cyxchat/lib -B "cyxchat/lib/$BUILD_DIR" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM="android-${{ env.ANDROID_API_LEVEL }}" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCYXWIZ_ROOT="$GITHUB_WORKSPACE/cyxwiz" \
              -DCYXWIZ_BUILD_DIR="$GITHUB_WORKSPACE/cyxwiz/$BUILD_DIR" \
              -DSODIUM_INCLUDE_DIR="$SODIUM_ROOT/include" \
              -DSODIUM_LIBRARY="$SODIUM_ROOT/lib/libsodium.a" \
              -DCYXCHAT_ENABLE_UPNP=OFF \
              -DCYXCHAT_BUILD_TESTS=OFF \
              -DCYXCHAT_BUILD_STATIC=OFF \
              -G Ninja
            cmake --build "cyxchat/lib/$BUILD_DIR" --config Release
          done

      - name: Copy Android native libraries
        run: |
          mkdir -p cyxchat/app/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p cyxchat/app/android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p cyxchat/app/android/app/src/main/jniLibs/x86_64
          cp cyxchat/lib/build-android-arm64/libcyxchat.so cyxchat/app/android/app/src/main/jniLibs/arm64-v8a/libcyxchat.so
          cp cyxchat/lib/build-android-arm32/libcyxchat.so cyxchat/app/android/app/src/main/jniLibs/armeabi-v7a/libcyxchat.so
          cp cyxchat/lib/build-android-x64/libcyxchat.so cyxchat/app/android/app/src/main/jniLibs/x86_64/libcyxchat.so

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo 'Android signing secrets are not configured; using debug signing fallback.'
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/cyxchat-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/cyxchat-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Flutter Android artifacts
        working-directory: cyxchat/app
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release
          flutter build appbundle --release

      - name: Package Android artifacts
        run: |
          mkdir -p release-assets
          cp cyxchat/app/build/app/outputs/flutter-apk/app-release.apk release-assets/CyxChat-Android.apk
          cp cyxchat/app/build/app/outputs/bundle/release/app-release.aab release-assets/CyxChat-Android.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CyxChat-Android
          path: |
            release-assets/CyxChat-Android.apk
            release-assets/CyxChat-Android.aab

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
      - build-android
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
