name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout CyxChat
        uses: actions/checkout@v4
        with:
          path: cyxchat

      - name: Checkout CyxWiz (parent)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/conspiracy
          path: cyxwiz
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install vcpkg and libsodium
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install libsodium:x64-windows
        shell: cmd

      - name: Build CyxWiz library
        run: |
          cd cyxwiz
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build build --config Release
        shell: cmd

      - name: Build CyxChat library
        run: |
          cd cyxchat\lib
          cmake -B build -DCMAKE_BUILD_TYPE=Release ^
            "-DCYXWIZ_LIBRARY=${{ github.workspace }}\cyxwiz\build\Release\cyxwiz.lib" ^
            "-DCYXWIZ_INCLUDE_DIR=${{ github.workspace }}\cyxwiz\include" ^
            "-DSODIUM_INCLUDE_DIR=C:/vcpkg/installed/x64-windows/include" ^
            "-DSODIUM_INCLUDE_DIRS=C:/vcpkg/installed/x64-windows/include" ^
            "-DSODIUM_LIBRARY=C:/vcpkg/installed/x64-windows/lib/libsodium.lib" ^
            "-DSODIUM_LIBRARIES=C:/vcpkg/installed/x64-windows/lib/libsodium.lib" ^
            -DCYXCHAT_BUILD_TESTS=OFF
          cmake --build build --config Release
        shell: cmd

      - name: Build Flutter app
        run: |
          cd cyxchat\app
          flutter pub get
          flutter build windows --release
        shell: cmd

      - name: Copy DLLs to release
        run: |
          copy cyxchat\lib\build\Release\cyxchat.dll cyxchat\app\build\windows\x64\runner\Release\
          copy C:\vcpkg\installed\x64-windows\bin\libsodium.dll cyxchat\app\build\windows\x64\runner\Release\
        shell: cmd

      - name: Create ZIP package
        run: |
          cd cyxchat/app/build/windows/x64/runner
          Compress-Archive -Path Release/* -DestinationPath CyxChat-Windows-x64.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyxChat-Windows-x64
          path: cyxchat/app/build/windows/x64/runner/CyxChat-Windows-x64.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: cyxchat/app/build/windows/x64/runner/CyxChat-Windows-x64.zip
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CyxChat
        uses: actions/checkout@v4
        with:
          path: cyxchat

      - name: Checkout CyxWiz (parent)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/conspiracy
          path: cyxwiz
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsodium-dev libbluetooth-dev
          sudo apt-get install -y clang git pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build CyxWiz library
        run: |
          cd cyxwiz
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build build --config Release

      - name: Build CyxChat library
        run: |
          cd cyxchat/lib
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            "-DCYXWIZ_LIBRARY=${{ github.workspace }}/cyxwiz/build/libcyxwiz.a" \
            "-DCYXWIZ_INCLUDE_DIR=${{ github.workspace }}/cyxwiz/include" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCYXCHAT_BUILD_TESTS=OFF \
            "-DSODIUM_INCLUDE_DIR=/usr/include" \
            "-DSODIUM_LIBRARY=/usr/lib/x86_64-linux-gnu/libsodium.so"
          cmake --build build --config Release

      - name: Build Flutter app
        run: |
          cd cyxchat/app
          flutter create --platforms=linux .
          flutter pub get
          flutter build linux --release

      - name: Copy libraries to release
        run: |
          cp cyxchat/lib/build/libcyxchat.so cyxchat/app/build/linux/x64/release/bundle/lib/

      - name: Create tarball
        run: |
          cd cyxchat/app/build/linux/x64/release
          tar -czvf CyxChat-Linux-x64.tar.gz bundle/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyxChat-Linux-x64
          path: cyxchat/app/build/linux/x64/release/CyxChat-Linux-x64.tar.gz

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: cyxchat/app/build/linux/x64/release/CyxChat-Linux-x64.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout CyxChat
        uses: actions/checkout@v4
        with:
          path: cyxchat

      - name: Checkout CyxWiz (parent)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/conspiracy
          path: cyxwiz
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          brew install libsodium cmake ninja

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build CyxWiz library
        run: |
          cd cyxwiz
          SODIUM_PREFIX=$(brew --prefix libsodium)
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCYXWIZ_TRANSPORT_BLUETOOTH=OFF \
            "-DSODIUM_INCLUDE_DIR=${SODIUM_PREFIX}/include" \
            "-DSODIUM_LIBRARY=${SODIUM_PREFIX}/lib/libsodium.a"
          cmake --build build --config Release

      - name: Build CyxChat library
        run: |
          cd cyxchat/lib
          SODIUM_PREFIX=$(brew --prefix libsodium)
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            "-DCYXWIZ_LIBRARY=${{ github.workspace }}/cyxwiz/build/libcyxwiz.a" \
            "-DCYXWIZ_INCLUDE_DIR=${{ github.workspace }}/cyxwiz/include" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCYXCHAT_BUILD_TESTS=OFF \
            "-DSODIUM_INCLUDE_DIR=${SODIUM_PREFIX}/include" \
            "-DSODIUM_LIBRARY=${SODIUM_PREFIX}/lib/libsodium.a"
          cmake --build build --config Release

      - name: Build Flutter app
        run: |
          cd cyxchat/app
          flutter create --platforms=macos .
          flutter pub get
          flutter build macos --release

      - name: Copy libraries to release
        run: |
          cp cyxchat/lib/build/libcyxchat.dylib "cyxchat/app/build/macos/Build/Products/Release/CyxChat.app/Contents/Frameworks/"

      - name: Create DMG package
        run: |
          cd cyxchat/app/build/macos/Build/Products/Release
          hdiutil create -volname "CyxChat" -srcfolder "CyxChat.app" -ov -format UDZO CyxChat-macOS.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyxChat-macOS
          path: cyxchat/app/build/macos/Build/Products/Release/CyxChat-macOS.dmg

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: cyxchat/app/build/macos/Build/Products/Release/CyxChat-macOS.dmg
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
