name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.24.0'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout CyxChat
        uses: actions/checkout@v4
        with:
          path: cyxchat

      - name: Checkout CyxWiz (parent)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/conspiracy
          path: cyxwiz
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install vcpkg and libsodium
        run: |
          if not exist C:\vcpkg git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install libsodium:x64-windows
        shell: cmd

      - name: Build CyxWiz library
        run: |
          cd cyxwiz
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build build --config Release
        shell: cmd

      - name: Find sodium path
        id: sodium
        run: |
          # vcpkg with toolchain installs to packages/, not installed/
          if (Test-Path "C:\vcpkg\packages\libsodium_x64-windows\include\sodium.h") {
            echo "SODIUM_INCLUDE=C:/vcpkg/packages/libsodium_x64-windows/include" >> $env:GITHUB_OUTPUT
            echo "SODIUM_LIBRARY=C:/vcpkg/packages/libsodium_x64-windows/lib/libsodium.lib" >> $env:GITHUB_OUTPUT
            echo "Found in packages directory"
          } elseif (Test-Path "C:\vcpkg\installed\x64-windows\include\sodium.h") {
            echo "SODIUM_INCLUDE=C:/vcpkg/installed/x64-windows/include" >> $env:GITHUB_OUTPUT
            echo "SODIUM_LIBRARY=C:/vcpkg/installed/x64-windows/lib/libsodium.lib" >> $env:GITHUB_OUTPUT
            echo "Found in installed directory"
          } else {
            echo "ERROR: sodium.h not found!"
            Get-ChildItem -Path "C:\vcpkg" -Recurse -Name "sodium.h" -ErrorAction SilentlyContinue | Select-Object -First 5
            exit 1
          }
        shell: pwsh

      - name: Build CyxChat library
        run: |
          cd cyxchat\lib
          cmake -B build -DCMAKE_BUILD_TYPE=Release ^
            "-DCYXWIZ_LIBRARY=${{ github.workspace }}\cyxwiz\build\Release\cyxwiz.lib" ^
            "-DCYXWIZ_INCLUDE_DIR=${{ github.workspace }}\cyxwiz\include" ^
            "-DSODIUM_INCLUDE_DIR=${{ steps.sodium.outputs.SODIUM_INCLUDE }}" ^
            "-DSODIUM_LIBRARY=${{ steps.sodium.outputs.SODIUM_LIBRARY }}" ^
            -DCYXCHAT_BUILD_TESTS=OFF
          cmake --build build --config Release
        shell: cmd

      - name: Build Flutter app
        run: |
          cd cyxchat/app
          flutter pub get
          flutter build windows --release
        shell: pwsh

      - name: Copy DLLs to release
        run: |
          $dest = "cyxchat/app/build/windows/x64/runner/Release"
          Write-Host "Destination: $dest"
          Write-Host "Checking if destination exists..."
          if (-not (Test-Path $dest)) {
            Write-Host "ERROR: Flutter build output not found at $dest"
            Get-ChildItem -Path "cyxchat/app/build" -Recurse -Directory | Select-Object -First 10
            exit 1
          }
          Write-Host "Copying cyxchat.dll..."
          Copy-Item "cyxchat/lib/build/Release/cyxchat.dll" $dest
          Write-Host "Finding libsodium.dll..."
          if (Test-Path "C:/vcpkg/packages/libsodium_x64-windows/bin/libsodium.dll") {
            Write-Host "Found in packages/bin/"
            Copy-Item "C:/vcpkg/packages/libsodium_x64-windows/bin/libsodium.dll" $dest
          } elseif (Test-Path "C:/vcpkg/installed/x64-windows/bin/libsodium.dll") {
            Write-Host "Found in installed/bin/"
            Copy-Item "C:/vcpkg/installed/x64-windows/bin/libsodium.dll" $dest
          } else {
            Write-Host "WARNING: libsodium.dll not found, searching..."
            Get-ChildItem -Path "C:/vcpkg" -Recurse -Name "libsodium.dll" -ErrorAction SilentlyContinue | Select-Object -First 5
          }
          Write-Host "DLLs copied successfully"
        shell: pwsh

      - name: Create ZIP package
        run: |
          cd cyxchat/app/build/windows/x64/runner
          Compress-Archive -Path Release/* -DestinationPath CyxChat-Windows-x64.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyxChat-Windows-x64
          path: cyxchat/app/build/windows/x64/runner/CyxChat-Windows-x64.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: cyxchat/app/build/windows/x64/runner/CyxChat-Windows-x64.zip
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CyxChat
        uses: actions/checkout@v4
        with:
          path: cyxchat

      - name: Checkout CyxWiz (parent)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/conspiracy
          path: cyxwiz
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsodium-dev libbluetooth-dev
          sudo apt-get install -y clang git pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build CyxWiz library
        run: |
          cd cyxwiz
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build build --config Release

      - name: Build CyxChat library
        run: |
          cd cyxchat/lib
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            "-DCYXWIZ_LIBRARY=${{ github.workspace }}/cyxwiz/build/libcyxwiz.a" \
            "-DCYXWIZ_INCLUDE_DIR=${{ github.workspace }}/cyxwiz/include" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCYXCHAT_BUILD_TESTS=OFF \
            "-DSODIUM_INCLUDE_DIR=/usr/include" \
            "-DSODIUM_LIBRARY=/usr/lib/x86_64-linux-gnu/libsodium.so"
          cmake --build build --config Release

      - name: Build Flutter app
        run: |
          cd cyxchat/app
          flutter create --platforms=linux .
          flutter pub get
          flutter build linux --release

      - name: Copy libraries to release
        run: |
          cp cyxchat/lib/build/libcyxchat.so cyxchat/app/build/linux/x64/release/bundle/lib/

      - name: Create tarball
        run: |
          cd cyxchat/app/build/linux/x64/release
          tar -czvf CyxChat-Linux-x64.tar.gz bundle/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyxChat-Linux-x64
          path: cyxchat/app/build/linux/x64/release/CyxChat-Linux-x64.tar.gz

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: cyxchat/app/build/linux/x64/release/CyxChat-Linux-x64.tar.gz
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout CyxChat
        uses: actions/checkout@v4
        with:
          path: cyxchat

      - name: Checkout CyxWiz (parent)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/conspiracy
          path: cyxwiz
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          brew install libsodium cmake ninja

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build CyxWiz library
        run: |
          cd cyxwiz
          SODIUM_PREFIX=$(brew --prefix libsodium)
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCYXWIZ_TRANSPORT_BLUETOOTH=OFF \
            -DCYXWIZ_TRANSPORT_LORA=OFF \
            "-DSODIUM_INCLUDE_DIR=${SODIUM_PREFIX}/include" \
            "-DSODIUM_LIBRARY=${SODIUM_PREFIX}/lib/libsodium.a"
          cmake --build build --config Release

      - name: Build CyxChat library
        run: |
          cd cyxchat/lib
          SODIUM_PREFIX=$(brew --prefix libsodium)
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            "-DCYXWIZ_LIBRARY=${{ github.workspace }}/cyxwiz/build/libcyxwiz.a" \
            "-DCYXWIZ_INCLUDE_DIR=${{ github.workspace }}/cyxwiz/include" \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCYXCHAT_BUILD_TESTS=OFF \
            "-DSODIUM_INCLUDE_DIR=${SODIUM_PREFIX}/include" \
            "-DSODIUM_LIBRARY=${SODIUM_PREFIX}/lib/libsodium.a"
          cmake --build build --config Release

      - name: Build Flutter app
        run: |
          cd cyxchat/app
          flutter create --platforms=macos .
          # Update minimum macOS version for record_macos plugin
          sed -i '' 's/platform :osx, .*/platform :osx, "10.15"/' macos/Podfile
          # Also update MACOSX_DEPLOYMENT_TARGET in Xcode project (10.14 -> 10.15)
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 10.14/MACOSX_DEPLOYMENT_TARGET = 10.15/g' macos/Runner.xcodeproj/project.pbxproj
          flutter pub get
          flutter build macos --release

      - name: Copy libraries to release
        run: |
          # Find the .app bundle (could be cyxchat.app or app.app depending on flutter create)
          APP_BUNDLE=$(find cyxchat/app/build/macos/Build/Products/Release -name "*.app" -type d | head -1)
          echo "Found app bundle: $APP_BUNDLE"
          mkdir -p "$APP_BUNDLE/Contents/Frameworks"
          cp cyxchat/lib/build/libcyxchat.dylib "$APP_BUNDLE/Contents/Frameworks/"
          # Rename to CyxChat.app for consistency
          mv "$APP_BUNDLE" "cyxchat/app/build/macos/Build/Products/Release/CyxChat.app"

      - name: Create DMG package
        run: |
          cd cyxchat/app/build/macos/Build/Products/Release
          hdiutil create -volname "CyxChat" -srcfolder "CyxChat.app" -ov -format UDZO CyxChat-macOS.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyxChat-macOS
          path: cyxchat/app/build/macos/Build/Products/Release/CyxChat-macOS.dmg

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: cyxchat/app/build/macos/Build/Products/Release/CyxChat-macOS.dmg
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
